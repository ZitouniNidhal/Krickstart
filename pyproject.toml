[project]
name = "devspeed"
version = "0.1.0"
description = "Lightning-fast local dev environment manager by Nidhal Zitouni"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "build>=1.2",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML",
    "pytest-cov>=4.1",
    "pip-audit>=2.7",
]

[project.scripts]
devspeed = "devspeed.cli:main"

[project.entry-points."devspeed.stacks"]
node-postgres-redis = "devspeed.stacks.node_postgres_redis:plugin"
fastapi-postgres = "devspeed.stacks.fastapi_postgres:plugin"
django-postgres = "devspeed.stacks.django_postgres:plugin"
flask-postgres = "devspeed.stacks.flask_postgres:plugin"
go-gin-postgres = "devspeed.stacks.go_gin_postgres:plugin"
nextjs-postgres = "devspeed.stacks.nextjs_postgres:plugin"
spring-boot-postgres = "devspeed.stacks.spring_boot_postgres:plugin"
express-mongodb = "devspeed.stacks.express_mongodb:plugin"
spring-boot-mysql = "devspeed.stacks.spring_boot_mysql:plugin"
laravel-mysql = "devspeed.stacks.laravel_mysql:plugin"

[build-system]
requires = ["setuptools>=61.0"]  # Or hatchling, flit, etc.
build-backend = "setuptools.build_meta"

[project]
name = "devspeed"  # Must be unique on PyPI, not conflicting with existing packages
version = "0.1.0"  # Version number, can be updated with each release
description = "A brief description of your project"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}  # Or use SPDX expression, such as license = "MIT"
authors = [
    {name = "ZitouniNidhal"}
]
dependencies = [
    # List the packages your project depends on here, e.g., "requests>=2.0"
]

[project.urls]
Homepage = "https://github.com/ZitouniNidhal/devspeed"
