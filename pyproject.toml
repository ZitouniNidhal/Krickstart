[project]
name = "devspeed"
version = "0.1.0"
description = "Lightning-fast local dev environment manager powered by Docker Compose"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Nidhal Zitouni", email = "zitouninidhal@gmail.com" },
]
keywords = ["developer-tools", "docker", "docker-compose", "dev-environment", "dx", "local-development"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ZitouniNidhal/devspeed"
Documentation = "https://github.com/ZitouniNidhal/devspeed#readme"
Repository = "https://github.com/ZitouniNidhal/devspeed.git"
Issues = "https://github.com/ZitouniNidhal/devspeed/issues"
Changelog = "https://github.com/ZitouniNidhal/devspeed/blob/master/ROADMAP.md"

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "build>=1.2",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
devspeed = "devspeed.cli:main"

[project.entry-points."devspeed.stacks"]
node-postgres-redis = "devspeed.stacks.node_postgres_redis:plugin"
fastapi-postgres = "devspeed.stacks.fastapi_postgres:plugin"
django-postgres = "devspeed.stacks.django_postgres:plugin"
flask-postgres = "devspeed.stacks.flask_postgres:plugin"
nextjs-postgres = "devspeed.stacks.nextjs_postgres:plugin"
go-gin-postgres = "devspeed.stacks.go_gin_postgres:plugin"
spring-boot-postgres = "devspeed.stacks.spring_boot_postgres:plugin"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["devspeed", "devspeed.core", "devspeed.plugins", "devspeed.stacks"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
