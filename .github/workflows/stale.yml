name: Stale Management

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: "This issue has been inactive for 30 days and will be closed soon."
          days-before-stale: 30
          stale-pr-message: "This PR has been inactive for 14 days and will be closed soon."
          days-before-stale-pr: 14
