name: Publish VS Code Extension

on:
  push:
    tags:
      - 'ext-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd vscode-extension
          npm install

      - name: Compile Extension
        run: |
          cd vscode-extension
          npm run compile

      - name: Publish to Marketplace
        uses: microsoft/vscode-marketplace-publish@v1
        with:
          personalAccessToken: ${{ secrets.VSCODE_MP_TOKEN }}
          package: vscode-extension/out
