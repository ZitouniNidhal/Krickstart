name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Scan Dependencies
        run: pip-audit
